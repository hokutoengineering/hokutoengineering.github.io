<!-- Dark theme forced overrides -->
<style>
/* ── Dark theme palette (GitHub Dark Dimmed inspired) ── */
:root {
  --dark-bg: #1b1f24;
  --dark-bg-secondary: #15191e;
  --dark-surface: #23272e;
  --dark-text: #c9d1d9;
  --dark-text-muted: #8b949e;
  --dark-border: #30363d;
  --dark-link: #58a6ff;
  --dark-link-hover: #79b8ff;
  --dark-code-bg: #2a2f36;
  --dark-header: #f0f6fc;
  --dark-btn-bg: #2d333b;
  --dark-btn-hover: #3a414a;
}

/* ── Base ── */
html, body {
  background-color: var(--dark-bg) !important;
  color: var(--dark-text) !important;
}

.main-content-wrap {
  background-color: transparent !important;
}

a {
  color: var(--dark-link) !important;
}

a:hover,
a:focus {
  color: var(--dark-link-hover) !important;
}

/* ── Navigation / Menu toggle ── */
.site-nav .page-link,
.nav-list a,
.nav-list .list-item {
  color: var(--dark-text) !important;
}

.site-nav label[for="site-search"],
#site-search {
  color-scheme: dark !important;
}

/* ── Headings ── */
h1, h2, h3, h4, h5, h6,
.post-list__item h1 a,
.post-list__item h2 a {
  color: var(--dark-header) !important;
}

/* ── Blockquote ── */
blockquote {
  border-left-color: var(--dark-border) !important;
  background: var(--dark-surface) !important;
  color: var(--dark-text-muted) !important;
}

/* ── Code & highlights ── */
code,
pre,
div.highlighter-rouge div.highlight div.highlight pre,
.highlight {
  background-color: var(--dark-code-bg) !important;
  color: var(--dark-text) !important;
  border-color: var(--dark-border) !important;
}

/* ── Tables ── */
table thead th,
th {
  background-color: var(--dark-btn-bg) !important;
  color: var(--dark-header) !important;
  border-color: var(--dark-border) !important;
}

td {
  border-color: var(--dark-border) !important;
  color: var(--dark-text) !important;
}

/* ── Horizontal rule ── */
hr {
  border-color: var(--dark-border) !important;
}

/* ── Lists & paragraphs ── */
li,
p {
  color: var(--dark-text) !important;
}

/* ── Footer ── */
.site-footer {
  border-top-color: var(--dark-border) !important;
  color: var(--dark-text-muted) !important;
}

.site-footer a {
  color: var(--dark-link) !important;
}

/* ── Buttons & form elements ── */
button, input, select, textarea {
  color-scheme: dark !important;
}

/* ── Footnotes ── */
.footvotes,
.footnotes ol {
  color: var(--dark-text) !important;
}

dd, dt {
  color: var(--dark-text) !important;
}

/* ── Game card grid ── */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.5rem;
  margin: 1.5rem 0;
}

.game-card {
  background: var(--dark-surface) !important;
  border: 1px solid var(--dark-border) !important;
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.15s ease, border-color 0.15s ease;
}

.game-card:hover {
  border-color: var(--dark-link) !important;
  transform: translateY(-2px);
}

.game-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  display: block;
}

.game-card h3 {
  padding: 0.75rem 1rem;
  margin: 0;
  font-size: 0.95rem;
  color: var(--dark-header) !important;
  text-align: center;
}

.game-card a {
  text-decoration: none;
  display: block;
  height: 100%;
}
</style>
<!-- /Dark theme forced overrides -->
